<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" type="image/svg+xml" href="./assets/images/tom.svg" />
        <link rel="manifest" href="./manifest.json" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>marcinlowercase</title>
        <link rel="stylesheet" href="./css/global.css" />
        <link rel="stylesheet" href="./css/home.css" />
    </head>
    <body>
        <main id="canvas">
            <!-- svg dynamic connector dotted lines -->
            <svg id="arrows-layer" class="arrows-layer">
                <path id="line-tom-to-a" class="canvas-arrow" />
                <path id="line-tom-to-w" class="canvas-arrow" />
                <path id="line-note-to-theo" class="canvas-arrow" />
            </svg>

            <!-- interactive draggable logo -->
            <div id="item-logo" class="canvas-item item-logo" role="button" tabindex="0" aria-label="toggle dark theme" draggable="false">
                <img src="./assets/images/transparent_tom.svg" alt="transparent tom logo" class="canvas-logo logo-transparent" draggable="false" />
                <img src="./assets/images/tom.svg" alt="solid tom logo" class="canvas-logo logo-solid" draggable="false" />
            </div>

            <!-- draggable project: browser icon -->
            <a id="item-project-a" href="https://browser.oo1.studio" target="_blank" rel="noopener noreferrer" class="canvas-item item-project" title="browser" draggable="false">
                <img src="./assets/images/a.svg" alt="a logo" class="project-icon" draggable="false" />
            </a>

            <!-- draggable project: keyboard icon -->
            <a id="item-project-w" href="https://keyboard.oo1.studio" target="_blank" rel="noopener noreferrer" class="canvas-item item-project" title="keyboard" draggable="false">
                <img src="./assets/images/w.svg" alt="w logo" class="project-icon" draggable="false" />
            </a>

            <!-- draggable note for theo portrait -->
            <div id="note-face" class="canvas-item canvas-note" draggable="false">
                <span>pull up to see Theo</span>
            </div>

            <!-- pull-up peeking portrait anchored to bottom right -->
            <div id="item-portrait" class="peeking-portrait" role="button" tabindex="0" aria-label="view theo photo" draggable="false">
                <img src="./assets/images/theo.png" alt="theo portrait" class="portrait-image" draggable="false" />
            </div>

            <!-- pinned top text display with link to oo1 studio -->
            <header id="top-display" class="top-display">
                <p id="display-text" class="display-text">
                    I am Theo a.k.a. marcinlowercase, the developer of <a href="https://oo1.studio" target="_blank" rel="noopener noreferrer">oo1 studio</a>
                </p>
            </header>
        </main>
        <script src="./js/home.js"></script>
    </body>
</html>
